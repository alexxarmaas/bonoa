name: Pilot lockfile repair
on:
  pull_request:
    branches: [develop]
    paths: [.github/workflows/pilot-lockfile-repair.yml]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.head_ref == 'fix/web-only-pilot-release' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve current Playwright without lifecycle scripts
        run: |
          npm install --save-dev --save-exact playwright@latest --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Export audited manifests
        run: |
          echo 'BONOA_LOCKFILE_BEGIN'
          cat package-lock.json
          echo 'BONOA_LOCKFILE_END'
          echo 'BONOA_PACKAGE_BEGIN'
          cat package.json
          echo 'BONOA_PACKAGE_END'
