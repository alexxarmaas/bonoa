name: Pilot lockfile repair
on:
  push:
    branches: [fix/web-only-pilot-release]
    paths: [.github/workflows/pilot-lockfile-repair.yml]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve patched dependencies without lifecycle scripts
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Upload audited manifests
        uses: actions/upload-artifact@v4
        with:
          name: audited-pilot-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 1
