name: Pilot lockfile repair
on:
  push:
    branches: [fix/web-only-pilot-release]
    paths: [.github/workflows/pilot-lockfile-repair.yml]
  pull_request:
    branches: [develop]
    paths: [.github/workflows/pilot-lockfile-repair.yml]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/fix/web-only-pilot-release' || (github.head_ref == 'fix/web-only-pilot-release' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Resolve patched dependencies without lifecycle scripts
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=critical
      - name: Export audited manifests
        run: |
          echo 'BONOA_LOCKFILE_BEGIN'
          cat package-lock.json
          echo 'BONOA_LOCKFILE_END'
          echo 'BONOA_PACKAGE_BEGIN'
          cat package.json
          echo 'BONOA_PACKAGE_END'
      - name: Upload audited manifests
        uses: actions/upload-artifact@v4
        with:
          name: audited-pilot-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 1
