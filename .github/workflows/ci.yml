name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
      - "chore/**"
      - "refactor/**"
      - "docs/**"
      - "test/**"
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dssxekvsmrlpkoqtgtmw.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_PZm9WYJz_S5_b5ggR3HHuw_XQkewdNO' }}
        run: npm run check

      - name: Start built app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dssxekvsmrlpkoqtgtmw.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_PZm9WYJz_S5_b5ggR3HHuw_XQkewdNO' }}
        run: |
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/bonoa-next.log 2>&1 &
          echo $! > /tmp/bonoa-next.pid

      - name: Wait for app
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bonoa-next.log
          exit 1

      - name: Smoke tests
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run smoke

      - name: Pilot contract tests
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run pilot:contract

      - name: Install browser E2E runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_BUSINESS_EMAIL: ${{ secrets.E2E_BUSINESS_EMAIL }}
          E2E_BUSINESS_PASSWORD: ${{ secrets.E2E_BUSINESS_PASSWORD }}
          E2E_BUSINESS_ID: ${{ secrets.E2E_BUSINESS_ID }}
          E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
          E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
        run: node scripts/browser-e2e.mjs

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/bonoa-next.pid ]; then
            kill "$(cat /tmp/bonoa-next.pid)" || true
          fi
