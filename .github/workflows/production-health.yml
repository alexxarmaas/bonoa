name: Production availability
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check production web and public data path
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://dssxekvsmrlpkoqtgtmw.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_PZm9WYJz_S5_b5ggR3HHuw_XQkewdNO' }}
        run: node scripts/monitor-production.mjs
