name: Generate package lock

on:
  push:
    branches:
      - chore/generate-lockfile

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/generate-lockfile

      - name: Stop when lockfile already exists
        id: lock
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.lock.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate lockfile
        if: steps.lock.outputs.exists != 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        if: steps.lock.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package lock"
          git push origin HEAD:chore/generate-lockfile
